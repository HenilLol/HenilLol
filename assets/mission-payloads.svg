      <text x="7" y="11" class="mono val-cyan" font-size="9">Python</text>
      <rect x="68" y="0" width="38" height="15" rx="3" fill="#0A1826" stroke="#1E3554" stroke-width="0.8" />
      <text x="75" y="11" class="mono val-cyan" font-size="9">Web</text>
    </g>

    <!-- Subsystem Flow Architecture -->
    <text x="426" y="337" class="mono micro-dim">BUS:</text>
    <text x="456" y="337" class="mono val-titanium" font-size="9">IMAGE TENSOR → RESNET INFERENCE → DISPATCH</text>

