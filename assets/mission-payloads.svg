    <rect x="674" y="222" width="120" height="16" rx="8" fill="#072216" stroke="#00E599" stroke-width="0.8" />
    <circle cx="684" cy="230" r="3" fill="#00E599" class="anim-beacon" />
    <text x="692" y="233" class="mono val-emerald" font-size="9">VERIFIED REPO</text>

    <!-- Title & Class -->
