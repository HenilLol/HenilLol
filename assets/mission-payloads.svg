  <g id="mod-recyclens">
    <rect x="416" y="218" width="388" height="160" rx="6" fill="url(#card-bg-grad)" stroke="#00E599" stroke-width="1.2" />
    <rect x="416" y="218" width="388" height="24" rx="6" fill="#0A1F18" />
    <line x1="416" y1="242" x2="804" y2="242" stroke="#1E2D44" stroke-width="1" />

