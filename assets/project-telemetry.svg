    <text x="392.0" y="28" class="mono sub-text" text-anchor="middle">Python</text>
    <rect x="430" y="16" width="45" height="18" rx="3" fill="#12171F" stroke="#30363D" stroke-width="1" />
    <text x="452.5" y="28" class="mono sub-text" text-anchor="middle">Web</text>

    <!-- Status Badge -->
