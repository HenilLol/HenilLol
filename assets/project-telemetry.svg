    <text x="16" y="24" class="mono proj-name">03 // FLUXDOCK</text>
    <text x="16" y="42" class="mono proj-desc">Robotics / vision / control system</text>
    
    <!-- Stack Tags -->
    <rect x="360" y="16" width="45" height="18" rx="3" fill="#12171F" stroke="#30363D" stroke-width="1" />
    <text x="382.5" y="28" class="mono sub-text" text-anchor="middle">C++</text>
    <rect x="411" y="16" width="64" height="18" rx="3" fill="#12171F" stroke="#30363D" stroke-width="1" />
    <text x="443.0" y="28" class="mono sub-text" text-anchor="middle">Python</text>

    <!-- Status Badge -->
    <rect x="580" y="16" width="95" height="20" rx="3" fill="#12171F" stroke="#30363D" stroke-width="1" />
