name: Update Profile Art Assets

# Automated workflow structure for fetching public GitHub contributions
# and re-rendering profile SVG assets (heatmap, info card, ASCII identity).

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch public contribution data
        run: |
          python scripts/fetch_contributions.py --strict

      - name: Render SVG assets
        run: |
          python scripts/render_heatmap_svg.py
          python scripts/make_info_card.py
          python scripts/make_ascii_svg.py

      - name: Verify SVG outputs
        run: |
          ls -la assets/

      - name: Commit and push changes if updated
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/ data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "build: update profile SVG art assets [skip ci]" && git push)
